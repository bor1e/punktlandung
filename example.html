e Beispieldatei?","context":"Epic: Die Daten kommen „über CSV-Dateien, die regelmäßig bereitgestellt werden“, „aus einer separaten Datenquelle“. Format und Beispiel fehlen. Für FRE liegen drei Testzeilen vor.","options":["Gleiches Format wie die FRE-CSV","Anderes Format: Beispieldatei und Feldbeschreibung werden geliefert (bitte Ablageort nennen)","Steht noch nicht fest (bitte Termin nennen)"],"proposal":null,"reason":"Kein Vorschlag: Faktenfrage. Ohne Beispieldatei gibt es für die Steuerbox kein prüfbares Szenario.","raci":{"FB":"R","ARCH":"A","MW":"C","DEV":"C"},"ref":"FS-02","dependsOn":[]},{"id":"new-2b","group":"uc4","topic":"new-2","keystoneDependent":false,"title":"Weg ins Backend","question":"Auf welchem Weg kommen die Steuerbox-Daten ins Backend?","context":"FRE heute: Die Middleware liest die CSV und sendet je Steuerhandlung einen Aufruf mit Zeitpunkt, Gruppe, Stufe und Status. Das Backend liest keine CSV und hat keinen Zeitplan.","options":["Wie FRE: über die Middleware und denselben Aufruf","Eigene Schnittstelle für Steuerbox-Daten","Anderer Weg (bitte nennen)"],"proposal":0,"reason":"Der Weg läuft bereits; das Backend bleibt bis auf das Feld Steuereinrichtung gleich. Eine eigene Schnittstelle kann die Deployment-Konfiguration ändern; dann ist das Plattform-Team einzubinden.","raci":{"ARCH":"A","MW":"R","DEV":"C","FB":"I","PLAT":"C"},"ref":"FS-02","dependsOn":["new-2a"]},{"id":"new-2c","group":"uc4","topic":"new-2","keystoneDependent":false,"title":"Takt","question":"Wie schnell nach einer Steuerhandlung der Steuerbox muss sie in der Anwendung sichtbar sein?","context":"Epic: „regelmäßig bereitgestellt“, ohne Takt. Für FRE nennt das Epic eine „tägliche Abholung“.","options":["Täglich, wie bei FRE","Mit festem Verzug (bitte Minuten oder Stunden nennen)"],"proposal":0,"reason":"Der FRE-Weg läuft schon so. Die Systemführung bestätigt, ob die Quelle das liefern kann.","raci":{"FB":"AR","MW":"C","PO":"C"},"ref":"FS-02","dependsOn":[]},{"id":"N-FS06","group":"  s+='<div class="meta">'+(u.actor?'<span>'+T.ucActor+': '+h(u.actor)+'</span>':'')+(u.src?'<span>'+T.ucSource+': '+h(u.src)+'</span>':'')+(u.ref?'<span>'+T.ucRef+': '+h(u.ref)+'</span>':'')+'</div>';
 if(KS&&KS.mootGroups&&KS.mootGroups.indexOf(u.id)>=0&&ans(KS.id).o===String(KS.mootOption)&&KS.mootGroupBanner){
  s+='<div class="banner info">ⓘ <span>'+h(KS.mootGroupBanner)+'</span></div>';
 }
 if(u.goal){s+='<div class="callout"><b>'+T.ucGoal+'</b><p>'+h(u.goal)+'</p></div>'}
 s+='<h2>'+T.ucScenarios+'</h2><div class="panel wide"><table><tr><th style="width:92px">'+T.colId+'</th><th>'+T.colInit+'</th><th>'+T.colAct+'</th><th>'+T.colExp+'</th><th style="width:150px">'+T.colState+'</th></tr>';
 u.scenarios.forEach(function(r){s+='<tr><td class="mono">'+h(r[0])+'</td><td>'+h(r[2])+'</td><td>'+h(r[3])+'</td><td>'+h(r[4])+'</td><td>'+standChip(r[1])+'</td></tr>'});
 s+='</table></div>';
 if(u.note){s+='<p class="small">'+h(u.note)+'</p>'}
 var qs=Q.filter(function(q){return q.uc===u.id}),m=qs.filter(function(q){return mine(q,S.role)}),o=qs.filter(function(q){return !mine(q,S.role)});
 s+='<h2>'+(S.role?T.ucOpenFor(P[S.role].k):T.ucOpenAll)+'</h2>';
 s+=m.length?topics(m).map(tpCard).join(''):'<p class="small">'+T.ucEmpty+'</p>';
 if(o.length){s+='<h2>'+T.ucOthers+'</h2><div class="panel wide"><table><tr><th style="width:120px">'+T.colId+'</th><th>'+T.colQ+'</th><th>'+T.colDecider+'</th><th>'+T.colSupplier+'</th><th style="width:150px">'+T.colState+'</th></tr>'+o.map(miniRow).join('')+'</table></div>'}
 return s;
}
UC.forEach(function(u){V[u.id]=function(){return ucView(u)}});

V.fragen=function(){
 var s='<h1>'+T.qTitle+'</h1><p class="lead-in">'+T.qLead+'</p>';
 s+='<div class="tools"><button class="chip'+(F.p===''?' on':'')+'" data-p="">'+T.filterAll+' ('+Q.length+')</button>';
 ORDER.forEach(function(p){var n=count(function(q){return mine(q,p)});if(n){s+='<button class="chip'+(F.p===p?' on':'')+'" data-p="'+h(p)+'"><i style="background:'+P[p].c+'"></i>'+h(P[p].k)+' ('+n+')</button>'}});
 s+='</div><div class="tools"><button class="chip'+(F.open?' on':'')+'" data-open>'+T.filterOpen+'</button><button class="chip'+(F.norec?' on':'')+'" data-norec>'+T.filterNorec+' ('+count(function(q){return q.rec==null})+')</button><button class="btn sec2" type="button" data-recs>'+T.acceptRecs+'</button></div>';
 var list=Q.filter(function(q){return mine(q,F.p)&&(!F.open||isOpen(q))&&(!F.norec||q.rec==null)});
 if(!list.length){s+='<p class="small">'+T.noMatch+'</p>'}
 GROUPS.forEach(function(g){
  var qs=list.filter(function(q){return q.uc===g.id});
  if(qs.length){
   var hdr=g.badge?(g.badge+' · '+g.title):g.title;
   s+='<h2>'+h(hdr)+'</h2>'+topics(qs).map(tpCard).join('');
  }
 });
 return s;
};

V.raci=function(){
 var s='<h1>'+T.raciTitle+'</h1><p class="lead-in">'+T.raciLead+'</p>';
 if(CTX.assignmentNote){s+='<div class="banner info">ⓘ <span>'+h(CTX.assignmentNote)+'</span></div>'}
 s+='<div class="kpis">'+ORDER.map(function(p){var a=count(function(q){return has(q,p,'A')}),r=count(function(q){return has(q,p,'R')&&!has(q,p,'A')});return '<div class="kpi" style="border-top:4px solid '+P[p].c+'"><b>'+a+'</b><span>'+h(P[p].k)+' '+T.decides+' · '+T.supplies+' '+r+'</span></div>'}).join('')+'</div>';
 s+='<p class="small">'+T.raciLegend+'</p>';
 s+='<div class="panel wide"><table class="raci"><tr><th style="width:118px">'+T.colId+'</th><th>'+T.colQ+'</th>'+ORDER.map(function(p){return '<th class="c">'+pchip(p,false,P[p].s)+'</th>'}).join('')+'<th style="width:120px">'+T.colState+'</th></tr>';
 GROUPS.forEach(function(g){
  var gqs=Q.filter(function(q){return q.uc===g.id});
  if(!gqs.length){return}
  var hdr=g.badge?(g.badge+' · '+g.title):g.title;
  s+='<tr class="grp"><td colspan="'+(ORDER.length+3)+'">'+h(hdr)+'</td></tr>';
  gqs.forEach(function(q){
   s+='<tr><td><a class="sec" href="#fragen:'+h(q.id)+'">'+h(q.id)+'</a></td><td>'+h((q.tp?tpTitle(q.tp)+': ':'')+q.t)+'</td>'+ORDER.map(function(p){var v=q.r[p]||'',c=P[p].c;return '<td class="c">'+v.split('').map(function(x){return x==='A'?'<span class="r" style="background:'+c+';border-color:'+c+';color:#fff">A</span>':x==='R'?'<span class="r" style="color:'+c+';border-color:'+c+'">R</span>':'<span class="r '+x+'">'+x+'</span>'}).join(' ')+'</td>'}).join('')+'<td>'+statusChip(q)+'</td></tr>';
  });
 });
 s+='</table></div>';
 s+='<h2>'+T.rolesTitle+'</h2><div class="panel wide"><table><tr><th>'+T.colRole+'</th><th>'+T.colWho+'</th><th>'+T.colJob+'</th></tr>'+ORDER.map(function(p){return '<tr><td>'+pchip(p)+'</td><td>'+h(P[p].role)+'</td><td>'+h(P[p].job)+'</td></tr>'}).join('')+'</table></div>';
 if(SPEC.extraRolesNote){s+='<p class="small">'+h(SPEC.extraRolesNote)+'</p>'}
 if(CTX.constraints&&CTX.constraints.length){
  s+='<h2>'+T.constraintsTitle+'</h2><div class="panel"><ul class="plain">'+CTX.constraints.map(function(c){return '<li>'+h(c)+'</li>'}).join('')+'</ul></div>';
 }
 if(SPEC.missing&&SPEC.missing.length){
  s+='<h2>'+T.missingTitle+'</h2><div class="panel wide"><table><tr><th>'+T.colDoc+'</th><th>'+T.colCanSupply+'</th><th>'+T.colWhy+'</th></tr>'+SPEC.missing.map(function(m){return '<tr><td>'+h(m[0])+'</td><td>'+h(m[1])+'</td><td>'+h(m[2])+'</td></tr>'}).join('')+'</table></div>';
 }
 return s;
};

function summaryText(){
 var d=new Date(),ds=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
 var t=(SPEC.title||SPEC.brand)+': '+T.sumHeader+'\n'+T.sumBasis+': '+SPEC_FILE+', '+T.srcVersion+' '+SPEC_VER+'\n'+T.sumBy+': '+(S.name||T.sumNoName)+', '+ds+'\n';
 GROUPS.forEach(function(g){
  var qs=Q.filter(function(q){return q.uc===g.id&&isDone(q)});if(!qs.length){return}
  t+='\n'+(g.badge?(g.badge+' · '+g.title):g.title)+'\n';
  qs.forEach(function(q){var a=ans(q.id);t+='- '+q.id+' '+(q.tp?tpTitle(q.tp)+': ':'')+q.t+'\n  '+T.sumAnswer+': '+answerText(q)+(isMoot(q)?' ('+T.mootTag+')':'')+'\n'+(a.n?'  '+T.sumNote+': '+a.n+'\n':'')});
 });
 var open=Q.filter(isOpen);t+='\n'+T.sumStillOpen+' ('+open.length+'): '+open.map(function(q){return q.id}).join(', ')+'\n';
 return t;
}
function summaryJson(){
 return JSON.stringify({
  spec:SPEC_FILE,version:SPEC_VER,respondent:S.name||'',role:S.role||'',answeredAt:new Date().toISOString(),
  answers:Q.filter(isDone).map(function(q){var a=ans(q.id);return {id:q.id,topic:q.tp||q.id,ref:q.fs,decider:decider(q),optionIndex:a.o,answer:answerText(q),note:a.n||'',moot:isMoot(q)}}),
  openIds:Q.filter(isOpen).map(function(q){return q.id})
 },null,2);
}

V.antworten=function(){
 var done=Q.filter(isDone),s='<h1>'+T.ansTitle+'</h1><p class="lead-in">'+T.ansLead+'</p>';
 s+='<div class="tools"><input class="name" type="text" id="name" placeholder="'+h(T.namePh)+'" value="'+h(S.name)+'"><button class="btn" type="button" data-save>'+T.saveBtn+'</button><button class="btn sec2" type="button" data-copy>'+T.copyText+'</button><button class="btn sec2" type="button" data-copy-json>'+T.copyJson+'</button><button class="link" type="button" data-reset>'+T.resetAll+'</button></div>';
 if(!done.length){s+='<p class="small">'+T.noAnswers+'</p>'}
 else{
  s+='<div class="panel wide"><table><tr><th style="width:118px">'+T.colId+'</th><th>'+T.colQ+'</th><th>'+T.colDecider+'</th><th>'+T.colAnswer+'</th><th>'+T.colNote+'</th></tr>';
  done.forEach(function(q){s+='<tr><td><a class="sec" href="#fragen:'+h(q.id)+'">'+h(q.id)+'</a></td><td>'+h((q.tp?tpTitle(q.tp)+': ':'')+q.t)+'</td><td>'+pchip(decider(q),false,P[decider(q)].s)+'</td><td>'+h(answerText(q))+(isMoot(q)?' <span class="p ne">'+T.mootTag+'</span>':'')+'</td><td>'+h(ans(q.id).n)+'</td></tr>'});
  s+='</table></div>';
 }
 s+='<h2>'+T.asText+'</h2><textarea id="sum" readonly>'+h(summaryText())+'</textarea>';

};

V.quellen=function(){
 var s='<h1>'+T.srcTitle+'</h1><p class="lead-in">'+T.srcLead(h(SPEC_FILE),h(SPEC_VER))+'</p>';
 if(SPEC.outOfScope&&SPEC.outOfScope.length){s+='<h2>'+T.outTitle+'</h2><div class="panel"><ul class="plain">'+SPEC.outOfScope.map(function(o){return '<li>'+h(o)+'</li>'}).join('')+'</ul></div>'}
 if(SPEC.sources&&SPEC.sources.length){s+='<h2>'+T.srcListTitle+'</h2><div class="panel"><ul class="plain">'+SPEC.sources.map(function(x){return '<li>'+h(x)+'</li>'}).join('')+'</ul></div>'}
 if(SPEC.glossary&&SPEC.glossary.length){s+='<h2>'+T.glossaryTitle+'</h2><div class="panel wide"><table>'+SPEC.glossary.map(function(g){return '<tr><td style="width:170px"><b>'+h(g[0])+'</b></td><td>'+h(g[1])+'</td></tr>'}).join('')+'</table></div>'}
 return s;

/* ---------- Navigation & Events ---------- */
var cur='ueberblick';
function renderNav(){
 function link(id,label,n,cls){return '<a href="#'+h(id)+'"'+(cur===id?' class="active"':'')+'><span>'+label+'</span>'+(n==null?'':'<span class="cnt '+(cls||'')+'">'+n+'</span>')+'</a>'}
 var s=link('ueberblick',T.navOverview);
 if(UC.length){
  s+='<div class="group">'+T.navUseCases+'</div>';
  UC.forEach(function(u){var n=count(function(q){return q.uc===u.id&&isOpen(q)&&mine(q,S.role)});s+=link(u.id,h((u.badge?u.badge+' ':'')+u.title),n,n?'warn':'ok')});
 }
 var my=count(function(q){return isOpen(q)&&mine(q,S.role)});
 s+='<div class="group">'+T.navClarify+'</div>'+link('fragen',T.navQuestions,my,my?'warn':'ok')+link('raci',T.navRaci)+link('antworten',T.navAnswers,count(isDone))+link('quellen',T.navSources);
 s+='<div class="small" style="margin:10px 8px 0">'+h(T.navCountHint(roleName()))+'</div>';
 nav.innerHTML=s;
}
function render(focus){
 main.innerHTML=(V[cur]||V.ueberblick)();
 renderNav();
 syncDirtyButtons();
 if(focus){var el=main.querySelector('[data-q="'+focus+'"]');if(el){el.scrollIntoView({block:'start'});return}}
}
function route(target){
 var hsh=(typeof target==='string'?target:(location.hash||'#ueberblick').slice(1)).split(':'),id=hsh[0],focus=hsh[1];
 if(!V[id]){id='ueberblick'}
 if(id==='fragen'&&focus&&QI[focus]){F.p='';F.open=false;F.norec=false}
 cur=id;render(focus);if(!focus){window.scrollTo(0,0)}
}
function refreshCard(card,q){
 card.classList.toggle('moot',isMoot(q));
 var st=card.querySelector('[data-st]');if(st){st.outerHTML=statusChip(q)}
 card.querySelectorAll('.opt').forEach(function(l){var r=l.querySelector('input[type=radio]');l.classList.toggle('sel',r.checked)});
 var tp=card.closest('.tp');if(tp){tp.querySelector('[data-tpst]').textContent=tpState(tp.getAttribute('data-tp'))}
}
function setAns(id,patch){var a=ans(id);for(var k in patch){a[k]=patch[k]}S.a[id]=a;markDirty(true);persist()}
function keepScroll(){var y=window.scrollY;render();window.scrollTo(0,y)}
function copyStr(str,btn){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(function(){btn.textContent=T.copied},function(){fallbackCopy(str,btn)});return}
 fallbackCopy(str,btn);
}
function fallbackCopy(str,btn){
 var ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');btn.textContent=T.copied}catch(e){}
 ta.remove();
}

main.addEventListener('change',function(ev){
 var card=ev.target.closest('.q');if(!card||ev.target.type!=='radio'){return}
 var id=card.getAttribute('data-q');setAns(id,{o:ev.target.value});
 if(BRANCH_IDS[id]){keepScroll()}else{refreshCard(card,QI[id]);renderNav()}
});
main.addEventListener('input',function(ev){
 if(ev.target.id==='name'){S.name=ev.target.value;markDirty(true);persist();return}
 var card=ev.target.closest('.q'),f=ev.target.getAttribute('data-f');if(!card||!f){return}
 var id=card.getAttribute('data-q'),patch={};patch[f]=ev.target.value;
 if(f==='t'&&ev.target.value!==''){patch.o='x';card.querySelector('input[value="x"]').checked=true}
 setAns(id,patch);refreshCard(card,QI[id]);renderNav();
});
main.addEventListener('click',function(ev){
 var t=ev.target.closest?ev.target.closest('button'):null;if(!t){return}
 if(t.hasAttribute('data-clear')){delete S.a[t.closest('.q').getAttribute('data-q')];markDirty(true);persist();keepScroll();return}
 if(t.hasAttribute('data-p')){F.p=t.getAttribute('data-p');render();return}
 if(t.hasAttribute('data-open')){F.open=!F.open;render();return}
 if(t.hasAttribute('data-norec')){F.norec=!F.norec;render();return}
 if(t.hasAttribute('data-recs')){
  var list=Q.filter(function(q){return mine(q,F.p)&&isOpen(q)&&q.rec!=null&&(!F.norec)});
  if(!list.length){alert(T.noRecAlert);return}
  if(confirm(T.acceptConfirm(list.length))){list.forEach(function(q){setAns(q.id,{o:String(q.rec)})});keepScroll()}
  return;
 }
 if(t.hasAttribute('data-save')){saveHtml();return}
 if(t.hasAttribute('data-copy')){var ta=document.getElementById('sum');ta.value=summaryText();copyStr(ta.value,t);return}
 if(t.hasAttribute('data-copy-json')){copyStr(summaryJson(),t);return}
 if(t.hasAttribute('data-reset')){if(confirm(T.resetConfirm)){S.a={};markDirty(true);persist();render()}return}
});
async function saveHtml(){
 var d=new Date(),ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
 var clone=document.documentElement.cloneNode(true);
 ['#main','#nav','#role','#saveState'].forEach(function(sel){clone.querySelector(sel).innerHTML=''});
 clone.querySelectorAll('.dirty').forEach(function(el){el.classList.remove('dirty')});
 clone.querySelector('#saved').textContent=JSON.stringify({id:'f'+d.getTime().toString(36),at:d.toISOString(),S:S}).replace(/</g,'\\u003c');
 var htmlOut='<!doctype html>\n'+clone.outerHTML;
 var who=(S.name||(S.role?P[S.role].k:'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'answers';
 var prefix=(SPEC.id||'open-points').toLowerCase().replace(/[^a-z0-9-]+/g,'-');
 var filename=prefix+'-'+who+'-'+ds+'.html';
 if(typeof window.showSaveFilePicker==='function'){
  try{
   if(!fileHandle){
    fileHandle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'HTML Document',accept:{'text/html':['.html']}}]});
   }
   var w=await fileHandle.createWritable();
   await w.write(htmlOut);
   await w.close();
   markDirty(false);
   document.getElementById('saveState').textContent=T.savedFile(fileHandle.name||filename);
   return;
  }catch(err){
   if(err&&err.name==='AbortError'){return}
  }
 }
 var blob=new Blob([htmlOut],{type:'text/html;charset=utf-8'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
 markDirty(false);
 document.getElementById('saveState').textContent=T.savedFile(filename);
}
document.getElementById('btnSave').addEventListener('click',saveHtml);
roleSel.innerHTML='<option value="">'+h(T.allRoles)+'</option>'+ORDER.map(function(p){return '<option value="'+h(p)+'"'+(S.role===p?' selected':'')+'>'+h(P[p].k)+'</option>'}).join('');
roleSel.addEventListener('change',function(){S.role=roleSel.value;F.p=S.role;persist();render()});
document.addEventListener('click',function(ev){
 var a=ev.target.closest?ev.target.closest('a[href^="#"]'):null;if(!a){return}
 ev.preventDefault();var target=a.getAttribute('href').slice(1);
 if(a.hasAttribute('data-p')){var p=a.getAttribute('data-p');S.role=p;roleSel.value=p;F.p=p;F.open=false;F.norec=false;persist()}
 if(a.hasAttribute('data-norec')){F.p='';F.open=false;F.norec=true}
 try{history.pushState(null,'','#'+target)}catch(e){}
 route(target);
});
window.addEventListener('popstate',function(){route()});
if(EMB.at){document.getElementById('saveState').textContent=T.loadedSaved(S.name)}
route();
})();
</script>
</body></html>
