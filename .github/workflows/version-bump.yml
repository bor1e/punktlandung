name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-and-tag:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CHANGED=false
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if ! git diff --quiet HEAD~1 HEAD -- VERSION; then
              VERSION_CHANGED=true
            fi
          fi

          if [ "$VERSION_CHANGED" = true ]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          else
            NEXT="$(./scripts/bump-version.sh --from-commits --commit --tag)"
            TAG="v${NEXT}"
            git push origin HEAD:main
            git push origin "$TAG"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes || true
          fi
